name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build packages
        run: npm run build

      - name: Build example apps
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          VITE_BASE=/newick-sender/ VITE_TARGET_URL=https://tabee.wytamma.com/tree-viewer/ \
            npm run build -w @tabee/example-newick-sender
          mkdir -p _site/newick-sender
          cp -R examples/newick-sender/dist/. _site/newick-sender/

          VITE_BASE=/tree-viewer/ \
            npm run build -w @tabee/example-tree-viewer
          mkdir -p _site/tree-viewer
          cp -R examples/tree-viewer/dist/. _site/tree-viewer/

          VITE_BASE=/hello-sender/ VITE_TARGET_URL=https://tabee.wytamma.com/hello-receiver/ \
            npm run build -w @tabee/example-hello-sender
          mkdir -p _site/hello-sender
          cp -R examples/hello-sender/dist/. _site/hello-sender/

          VITE_BASE=/hello-receiver/ \
            npm run build -w @tabee/example-hello-receiver
          mkdir -p _site/hello-receiver
          cp -R examples/hello-receiver/dist/. _site/hello-receiver/

          cp site/index.html _site/index.html
          cp site/CNAME _site/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
