<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello Sender · CDEP demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
        --panel: #ffffff;
        --border: #e2e8f0;
        --accent: #0f172a;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --bg: #0b1120;
          --panel: #111827;
          --border: #1f2937;
          --accent: #e2e8f0;
          --error: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 48px 20px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      .sub { margin: 0 0 20px; color: var(--muted); }
      label { display: grid; gap: 5px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
      textarea, input, button {
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
      }
      textarea { min-height: 96px; resize: vertical; }
      button {
        cursor: pointer;
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
        padding: 9px 16px;
      }
      #status { min-height: 1.5em; margin: 14px 0 0; font-size: 14px; }
      #status[data-kind="error"] { color: var(--error); }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello Sender</h1>
      <p class="sub">The smallest sender: one format, one export adapter, one button.</p>

      <form id="send-form">
        <label>
          Message
          <textarea id="message" spellcheck="false">Hello from another origin.</textarea>
        </label>
        <label>
          Destination URL
          <input id="target" value="http://localhost:5186/" spellcheck="false" />
        </label>
        <button type="submit">Send</button>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
