<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tree Viewer · tabEE demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
        --panel: #ffffff;
        --border: #e2e8f0;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --bg: #0b1120;
          --panel: #111827;
          --border: #1f2937;
          --error: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 20px 64px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 860px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 24px; }
      .sub { margin: 0 0 24px; color: var(--muted); }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 12px;
      }
      #session { margin: 0; font-size: 14px; color: var(--muted); }
      #session[data-state="FAILED"] { color: var(--error); }
      #tree { width: 100%; height: auto; color: var(--fg); }
      #tree:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tree Viewer</h1>
        <p class="sub">Receiver only: imports Newick and renders the tree. No backend.</p>
      </header>

      <section>
        <h2>Incoming session</h2>
        <p id="session" role="status">No tabEE session in this window.</p>
      </section>

      <section>
        <h2>Tree</h2>
        <p class="meta">
          <span id="source">Nothing received yet</span>
          <span id="files">No files</span>
          <span id="leaves">No tree</span>
        </p>
        <svg id="tree"></svg>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
